<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Recuperar contraseña</h1>
      <p>Ingresa tu email y te enviaremos un enlace para restablecerla. El enlace expira en 1 hora.</p>
      <form id="forgotForm">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email" />
        <button type="submit">Enviar enlace</button>
      </form>
      <div id="msg" class="msg"></div>
    </main>
    <script>
      const form = document.getElementById('forgotForm');
      const msg = document.getElementById('msg');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const button = form.querySelector('button');
        button.disabled = true;
        msg.className = 'msg';
        msg.textContent = '';
        try {
          const res = await fetch('/api/sessions/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: form.email.value }),
          });
          const data = await res.json();
          msg.className = `msg ${res.ok ? 'success' : 'error'}`;
          msg.textContent = data.message;
        } catch {
          msg.className = 'msg error';
          msg.textContent = 'No fue posible conectar con el servidor';
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
