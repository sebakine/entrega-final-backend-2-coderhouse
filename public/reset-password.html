<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restablecer contraseña</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Restablecer contraseña</h1>
      <p id="intro">Validando el enlace...</p>
      <form id="resetForm" hidden>
        <label for="password">Nueva contraseña</label>
        <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password" />
        <label for="confirmPassword">Repite la contraseña</label>
        <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" required autocomplete="new-password" />
        <button type="submit">Guardar nueva contraseña</button>
      </form>
      <div id="msg" class="msg"></div>
      <p id="retry" hidden><a href="/forgot-password">Solicitar un nuevo enlace</a></p>
    </main>
    <script>
      const token = new URLSearchParams(window.location.search).get('token') || '';
      const form = document.getElementById('resetForm');
      const intro = document.getElementById('intro');
      const msg = document.getElementById('msg');
      const retry = document.getElementById('retry');

      const show = (text, type) => {
        msg.className = `msg ${type}`;
        msg.textContent = text;
      };

      (async () => {
        const res = await fetch(`/api/sessions/reset-password/validate?token=${encodeURIComponent(token)}`);
        const data = await res.json();
        if (!res.ok) {
          intro.textContent = '';
          show(data.message, 'error');
          retry.hidden = false;
          return;
        }
        intro.textContent = 'Ingresa tu nueva contraseña. Debe ser distinta a la anterior.';
        form.hidden = false;
      })();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (form.password.value !== form.confirmPassword.value) {
          return show('Las contraseñas no coinciden', 'error');
        }
        const button = form.querySelector('button');
        button.disabled = true;
        try {
          const res = await fetch('/api/sessions/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              token,
              password: form.password.value,
              confirmPassword: form.confirmPassword.value,
            }),
          });
          const data = await res.json();
          show(data.message, res.ok ? 'success' : 'error');
          if (res.ok) form.hidden = true;
        } catch {
          show('No fue posible conectar con el servidor', 'error');
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
